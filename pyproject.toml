[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vehicle-detection"
version = "0.1.0"
description = "Notebook-first BDD100K offline preprocessing and YOLO study"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<5",
  "PyYAML>=6,<7",
  "matplotlib>=3.9,<4",
  "ijson>=3.3,<4",
  "pandas>=2.2,<3",
  "Pillow>=10,<14",
]

[project.optional-dependencies]
study = [
  "bdd100k==1.0.1", "scalabel==0.3.1", "pydantic>=1.10,<2",
  "ultralytics==8.4.198", "torch>=2.4,<3", "torchvision>=0.19,<1",
  "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "jupyterlab>=4,<5",
]
demo = ["gradio==6.31.0", "ultralytics==8.4.198", "torch>=2.4,<3", "torchvision>=0.19,<1"]

[tool.uv]
conflicts = [[{ extra = "study" }, { extra = "demo" }]]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["runs", "weights", "data/bdd100k"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_detection"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "apps", "tests", "notebooks", "configs", "docs", "README.md", "data/README.md", "pyproject.toml", "uv.lock", ".github"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
