[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vehicle-detection"
version = "0.1.0"
description = "Reproducible BDD100K adaptive preprocessing experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<5",
  "PyYAML>=6,<7",
  "matplotlib>=3.9,<4",
  "ijson>=3.3,<4",
]

[project.optional-dependencies]
detector = ["ultralytics>=8.3,<9", "torch>=2.4,<3", "torchvision>=0.19,<1"]

[project.scripts]
vd = "vehicle_detection.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_detection"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "scripts", "README.md", "data/README.md", "pyproject.toml", "uv.lock", ".github"]
