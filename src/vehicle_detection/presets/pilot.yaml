seed: 42
data:
  tune_fraction: 0.2
  train_limit: 160
  tune_limit: 40
  holdout_limit: 80
  quality_samples: 100
training:
  model: yolo11n.pt
  epochs: 3
  batch: 8
  imgsz: 640
  device: cpu
operators:
  - name: gamma
    enabled: true
    params: {gamma: 0.65}
  - name: clahe
    enabled: true
    params: {clip_limit: 2.0, grid_size: 8}
  - name: denoise
    enabled: true
    params: {strength: 5.0}
  - name: sharpen
    enabled: true
    params: {amount: 0.5, sigma: 1.0}
policy:
  max_filters: 2
  brightness_below: 0.28
  contrast_below: 0.16
  noise_above: 0.035
  sharpness_below: 100.0
  sharpness_min: 10.0
benchmark:
  conditions: [clean]
  treatments: [raw, gamma, clahe, denoise, sharpen, adaptive]
  warmup: 3
  confidence: 0.001
  nms_iou: 0.7
  max_det: 300
  precision_confidence: 0.25
  min_stratum: 30
  samples: 3
stress:
  dark_factor: 0.35
  blur_sigma: 2.0
  noise_sigma: 18.0
  haze_alpha: 0.35
