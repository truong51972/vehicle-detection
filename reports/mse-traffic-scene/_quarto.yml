# FPT MSE / Computer Vision report scaffold; not yet template-validated by PDF render.
project:
  type: book
  output-dir: _book

lang: vi
bibliography: references.bib
execute:
  enabled: false

book:
  title: "Nhận thức cảnh giao thông: Phát hiện phương tiện và biển báo"
  subtitle: "Đồ án học phần Computer Vision"
  author:
    - "Đỗ Hữu Phát"
    - "Trần Trung Hiếu"
    - "Đinh Quốc Bảo"
    - "Trường Trần Quốc"
  output-file: "fpt-mse-traffic-scene"
  chapters:
    - index.qmd
    - frontmatter/abstract.qmd
    - chapters/01-introduction.qmd
    - chapters/02-literature-review.qmd
    - chapters/03-methodology.qmd
    - chapters/04-results.qmd
    - chapters/05-conclusions.qmd
    - references.qmd
  appendices:
    - appendices/A-cv-operators.qmd
    - appendices/B-experiment-protocol.qmd
    - appendices/C-evidence-register.qmd

format:
  pdf:
    documentclass: report
    pdf-engine: xelatex
    papersize: letter
    fontsize: 12pt
    mainfont: "Times New Roman"
    linestretch: 1.5
    geometry:
      - margin=1in
    toc: true
    toc-depth: 2
    number-sections: true
    number-depth: 2
    lof: true
    lot: true
    colorlinks: false
    include-in-header: styles/fpt-mse.tex

crossref:
  chapters: true
  fig-title: "Hình"
  tbl-title: "Bảng"
  appendix-title: "Phụ lục"
  appendix-delim: ":"
